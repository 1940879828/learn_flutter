name: keyboard_insets_adapter
description: Local thin Flutter plugin that exposes native keyboard inset height.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.learnflutter.keyboard_insets_adapter
        pluginClass: KeyboardInsetsAdapterPlugin
      ios:
        pluginClass: KeyboardInsetsAdapterPlugin
